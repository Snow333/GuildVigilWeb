</style></head><body><div class="gv-desk" style="min-height:100vh;padding:28px 18px 60px"><svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="i-hero" viewBox="0 0 12 18"><circle cx="6" cy="4" r="3.1"/><path d="M1 17 V11.5 C1 8.6 3 7.4 6 7.4 C9 7.4 11 8.6 11 11.5 V17 Z"/></symbol><symbol id="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3.4" y="7" width="9.2" height="6.8" rx="1"/><path d="M5.4 7 V5 A2.6 2.6 0 0 1 10.6 5 V7"/></symbol></defs></svg><div id="mk-root" class="mk-wrap"></div><noscript><p class="mk-lead">This mockup needs JavaScript on. It is interactive so you can count clicks.</p></noscript></div><script>/* ===== MOCKUP CORE — shared by all three band variants =====
   Mirrors the sim API in output/briefs-m2/trackBU-band-ui-mockups.md:
   partyRosters / unassignedHeroes / partyLevel(i) / board(i) / forecast(..., i) / assignHero.
   Difficulty words are a copy of src/sim/campaign/difficulty.ts (reason text for "Routine" changed
   from "the guild" to "them" — see report). Odds are SAMPLE numbers, not real forecasts. */
var GV = (function () {
  var MAXP = 6, PARTY_COUNT = 2, BEDS = 10, WEEK = 14, GOLD = 1240, FORECAST_N = 20;
  var HEROES0 = [
    { id: 'aldric', name: 'Aldric Vane',    cls: 'Fighter',   anc: 'Human',    lv: 7, hp: 84, hurt: 0, band: 0 },
    { id: 'sera',   name: 'Sera Wynn',      cls: 'Wizard',    anc: 'Elf',      lv: 7, hp: 46, hurt: 0, band: 0 },
    { id: 'tomas',  name: 'Brother Tomas',  cls: 'Cleric',    anc: 'Dwarf',    lv: 7, hp: 68, hurt: 0, band: 0 },
    { id: 'pip',    name: 'Pip Harrow',     cls: 'Rogue',     anc: 'Halfling', lv: 7, hp: 56, hurt: 0, band: 0 },
    { id: 'dag',    name: 'Dag Holloway',   cls: 'Fighter',   anc: 'Dwarf',    lv: 4, hp: 44, hurt: 0, band: 1 },
    { id: 'kessa',  name: 'Kessa Ironhand', cls: 'Barbarian', anc: 'Half-Orc', lv: 3, hp: 41, hurt: 9, band: 1 },
    { id: 'ivo',    name: 'Ivo Marsh',      cls: 'Bard',      anc: 'Human',    lv: 3, hp: 28, hurt: 0, band: 1 },
    { id: 'mina',   name: 'Mina Fenn',      cls: 'Sorcerer',  anc: 'Gnome',    lv: 2, hp: 19, hurt: 0, band: 1 },
    { id: 'wren',   name: 'Wren Ashby',     cls: 'Ranger',    anc: 'Human',    lv: 5, hp: 47, hurt: 0, band: null },
    { id: 'oskar',  name: 'Oskar Blythe',   cls: 'Rogue',     anc: 'Elf',      lv: 1, hp: 12, hurt: 0, band: null }
  ];
  /* real quest names; challenge = dungeon_level ?? min_level; pay/xp from midReward(); regions from world_regions */
  var QUESTS = [
    { id: 1005, name: 'The Silent Watchtower',  kind: 'Dungeon', ch: 4, region: 'Thornwood Reach', gold: 700,  xp: 560, exp: 15 },
    { id: 1002, name: 'The Bone Quarry',        kind: 'Dungeon', ch: 5, region: 'The Ashmark',     gold: 940,  xp: 750, exp: 16 },
    { id: 1006, name: 'Cult of the Pale Hand',  kind: 'Dungeon', ch: 6, region: 'Gravel Downs',    gold: 880,  xp: 700, exp: 15 },
    { id: 1003, name: 'Ogres on the Toll Road', kind: 'Fight',   ch: 6, region: 'The Vigil Lands', gold: 750,  xp: 600, exp: 16 },
    { id: 1007, name: 'Trolls at the Mill Bridge', kind: 'Fight', ch: 7, region: 'The Fallow Coast', gold: 880, xp: 700, exp: 15 },
    { id: 1011, name: 'The Minotaur Gang',      kind: 'Fight',   ch: 8, region: 'The Ashmark',     gold: 1000, xp: 800, exp: 16 }
  ];
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function q(id) { for (var i = 0; i < QUESTS.length; i++) if (QUESTS[i].id === id) return QUESTS[i]; return null; }
  function hero(id) { for (var i = 0; i < GV.s.heroes.length; i++) if (GV.s.heroes[i].id === id) return GV.s.heroes[i]; return null; }

  /* difficulty.ts, verbatim logic */
  function read(ch, lv) {
    var d = ch - lv;
    if (d <= -2) return { id: 'routine', label: 'Routine', tier: 0, reason: 'well within them', d: d };
    if (d <= 0) return { id: 'measured', label: 'Measured', tier: 1, reason: 'a fair match for them', d: d };
    if (d === 1) return { id: 'dangerous', label: 'Dangerous', tier: 2, reason: 'a level above them', d: d };
    return { id: 'beyond', label: 'Beyond us', tier: 3, reason: d === 2 ? 'two levels over them' : d + ' levels over them', d: d };
  }
  /* SAMPLE forecast (of FORECAST_N = 20): win / retreat / wipe by gap */
  function odds(d) {
    var t = d <= -2 ? [20, 0, 0] : d === -1 ? [19, 1, 0] : d === 0 ? [17, 3, 0] : d === 1 ? [11, 6, 3] :
      d === 2 ? [5, 8, 7] : d === 3 ? [2, 6, 12] : d === 4 ? [1, 3, 16] : d === 5 ? [0, 2, 18] : [0, 0, 20];
    return { win: t[0], ret: t[1], wipe: t[2], n: FORECAST_N };
  }
  function levelOf(list) { if (!list.length) return 1; var s = 0; list.forEach(function (h) { s += h.lv; }); return Math.max(Math.round(s / list.length), 1); }
  function init(mode) {
    var s = { heroes: HEROES0.map(function (h) { return Object.assign({}, h); }), out: [null, null], clicks: 0, mode: mode || 'start', ui: {} };
    if (mode === 'b2out') s.out[1] = 1005;
    GV.s = s;
  }
  function members(i) { return GV.s.heroes.filter(function (h) { return h.band === i; }); }
  function hall() { return GV.s.heroes.filter(function (h) { return h.band === null; }); }
  function lv(i) { return levelOf(members(i)); }
  function lvIf(h, to) { var m = members(to).filter(function (x) { return x.id !== h.id; }); m.push(h); return levelOf(m); }
  function canMove(h, to) {
    var s = GV.s;
    if (h.band !== null && s.out[h.band] != null) return { ok: false, why: 'Band ' + (h.band + 1) + ' is out on a job' };
    if (to !== null && s.out[to] != null) return { ok: false, why: 'Band ' + (to + 1) + ' is out on a job' };
    if (to !== null && h.band !== to && members(to).length >= MAXP) return { ok: false, why: 'Band ' + (to + 1) + ' is full (' + MAXP + ')' };
    return { ok: true, why: '' };
  }
  function move(id, to) { var h = hero(id); if (!canMove(h, to).ok) return false; h.band = to; return true; }
  function taken() { return GV.s.out.filter(function (x) { return x != null; }); }
  /* jobs a band could take, best first: not-Beyond first (safe tiers by XP, then Dangerous by XP), then Beyond (easiest first) */
  function rank(i) {
    var level = lv(i), t = taken();
    var list = QUESTS.filter(function (x) { return t.indexOf(x.id) < 0; });
    var withR = list.map(function (x) { return { q: x, r: read(x.ch, level) }; });
    var okay = withR.filter(function (x) { return x.r.tier < 3; });
    var bad = withR.filter(function (x) { return x.r.tier === 3; });
    function byXp(a, b) { return b.q.xp - a.q.xp || b.q.ch - a.q.ch || a.q.id - b.q.id; }
    var safe = okay.filter(function (x) { return x.r.tier <= 1; }).sort(byXp);
    var risky = okay.filter(function (x) { return x.r.tier === 2; }).sort(byXp);
    bad.sort(function (a, b) { return a.q.ch - b.q.ch || a.q.id - b.q.id; });
    return safe.concat(risky, bad);
  }
  function best(i, exclude) {
    var r = rank(i).filter(function (x) { return !exclude || exclude.indexOf(x.q.id) < 0; });
    return r.length && r[0].r.tier < 3 ? r[0] : null;
  }
  function send(i, qid) { GV.s.out[i] = qid; }
  function click() { GV.s.clicks++; }
  function money(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* shared pieces of markup */
  function face(h, k) { return '<span class="gv-portrait' + (k % 2 ? ' gv-portrait--r2' : '') + ' mk-face" aria-hidden="true"><svg viewBox="0 0 12 18"><use href="#i-hero"/></svg></span>'; }
  function word(r) { return '<span class="gv-difficulty gv-difficulty--s' + r.tier + ' mk-word" data-word="' + r.id + '"><i></i>' + r.label + '<span>' + r.reason + '</span></span>'; }
  function oddsLine(o) {
    return 'Win <b>' + o.win + '</b> of ' + o.n + (o.wipe > 0 ? ' · <span class="mk-bad">wiped ' + o.wipe + '</span>' : ' · no wipes');
  }
  function controls(extra) {
    var s = GV.s, both = s.out[0] != null && s.out[1] != null;
    return '<div class="mk-ctl" data-mk="controls"><span><b>Mockup controls</b> — not part of the game:</span>' +
      '<button class="gv-btn" data-mk-mode="start" aria-pressed="' + (s.mode === 'start') + '">Start of week</button>' +
      '<button class="gv-btn" data-mk-mode="b2out" aria-pressed="' + (s.mode === 'b2out') + '">Band 2 already out</button>' +
      (extra || '') +
      '<span class="mk-clicks"><span class="gv-plate">CLICKS THIS WEEK <b data-clicks>' + s.clicks + '</b></span>' +
      (both ? ' <span class="mk-done">Both bands sent.</span>' : '') + '</span></div>';
  }
  function deskbar() {
    return '<div class="gv-deskbar" style="margin-bottom:14px"><span class="gv-plate">WEEK <b>' + WEEK + '</b></span>' +
      '<span class="gv-plate">GOLD <b>' + money(GOLD) + '</b></span>' +
      '<span class="gv-plate">HEROES <b>10 of ' + BEDS + '</b> beds</span>' +
      '<span class="gv-plate">BANDS <b>2 of 3</b></span>' +
      '<span class="gv-plate">MARCH <b>' + MAXP + '</b> per band</span></div>';
  }
  function banner(tag, title, sub) {
    return '<div class="mk-banner"><span class="mk-tag">MOCKUP · M4 BAND SCREEN</span><span class="mk-tag alt">' + tag + '</span>' +
      '<span class="mk-note"><a href="band-variants-index.html">◂ all three variants</a></span></div>' +
      '<h1>' + title + '</h1>' + (sub ? '<p class="mk-lead">' + sub + '</p>' : '');
  }
  function band3() {
    return '<div class="mk-b3"><svg class="mk-ico" width="16" height="16"><use href="#i-lock"/></svg> <b>Band 3 is locked.</b> It needs Barracks level 3 (15 beds). You have ' + BEDS + '.</div>';
  }

  /* one delegated listener; each variant supplies its action table */
  function wire(actions, render) {
    document.addEventListener('click', function (e) {
      var m = e.target.closest('[data-mk-mode]');
      if (m) { init(m.getAttribute('data-mk-mode')); render(); return; }
      var t = e.target.closest('[data-act]');
      if (!t || t.disabled) return;
      var f = actions[t.getAttribute('data-act')];
      if (f && f(t.dataset) !== false) click();
      render();
    });
  }
  return { s: null, MAXP: MAXP, PARTY_COUNT: PARTY_COUNT, BEDS: BEDS, WEEK: WEEK, QUESTS: QUESTS, HEROES0: HEROES0, esc: esc, q: q, hero: hero, read: read, odds: odds,
    levelOf: levelOf, init: init, members: members, hall: hall, lv: lv, lvIf: lvIf, canMove: canMove, move: move, taken: taken, rank: rank, best: best, send: send,
    click: click, money: money, face: face, word: word, oddsLine: oddsLine, controls: controls, deskbar: deskbar, banner: banner, band3: band3, wire: wire };
})();

/* Variant C — THE WEEK PLAN: the guild proposes one job per band; you confirm once. */
(function () {
  var root = document.getElementById('mk-root');
  var LOCK = '<svg class="mk-ico" width="16" height="16"><use href="#i-lock"/></svg>';
  function first(h) { var p = h.name.split(' '); return p[0] === 'Brother' ? p[1] : p[0]; }

  /* the plan: Band 1 picks first, Band 2 picks from what is left */
  function plan() {
    var s = GV.s, res = [], used = [];
    for (var i = 0; i < GV.PARTY_COUNT; i++) {
      if (s.out[i] != null) { res.push({ out: true }); continue; }
      if (s.ui['skip' + i]) { res.push({ skip: true }); continue; }
      var list = GV.rank(i).filter(function (e) { return used.indexOf(e.q.id) < 0; });
      if (!list.length) { res.push({ none: true }); continue; }
      var idx = Math.min(s.ui['pick' + i] || 0, list.length - 1);
      used.push(list[idx].q.id);
      res.push({ e: list[idx], idx: idx, n: list.length, safe: list[0].r.tier < 3 });
    }
    return res;
  }
  function who(i) {
    var m = GV.members(i), faces = '', names = [];
    m.forEach(function (h, k) { faces += GV.face(h, k); names.push(first(h) + ' L' + h.lv); });
    for (var k = m.length; k < GV.MAXP; k++) faces += '<span class="mk-face b-emptyface"></span>';
    return '<div class="c-who"><div class="c-bn"><b>Band ' + (i + 1) + '</b><span class="gv-plate c-lv" data-level="' + i + '">LEVEL <b>' + GV.lv(i) + '</b></span></div>' +
      '<div class="c-faces">' + faces + '</div><p class="c-names">' + names.join(' · ') + '</p></div>';
  }
  function meta(x) { return x.kind + ' · ' + x.region + ' · challenge ' + x.ch + ' · ends wk ' + x.exp; }
  function row(i, p) {
    var s = GV.s, other = 1 - i, h = '';
    if (p.out) {
      var x = GV.q(s.out[i]), r = GV.read(x.ch, GV.lv(i));
      h = '<div class="c-job is-out"><div class="mk-lockline">' + LOCK + '<span class="gv-stamp mk-stamp">OUT ON A JOB</span></div><p class="a-jn">' + x.name + '</p><p class="a-meta">' + meta(x) + '</p>' + GV.word(r) +
        '<p class="a-lockmsg"><b>Locked.</b> Nobody can join or leave until this band is back.</p></div><div class="c-ctl"></div>';
    } else if (p.skip) {
      h = '<div class="c-job is-skip"><p class="a-jn mk-dim">Staying home this week</p><p class="a-meta">Band ' + (i + 1) + ' will not be sent. Its roster can still change.</p></div>' +
        '<div class="c-ctl"><button class="gv-btn" data-act="skip" data-band="' + i + '">Send them after all</button></div>';
    } else if (p.none) {
      h = '<div class="c-job"><p class="a-jn mk-dim">No job left</p><p class="a-meta">The other band has taken the last posting.</p></div><div class="c-ctl"></div>';
    } else {
      var e = p.e, o = GV.odds(e.r.d), warn = '';
      if (!p.safe) warn = '<p class="c-warn gv-marg">Nothing safe for Band ' + (i + 1) + ' this week — every job is “Beyond us”. The easiest is shown.</p>';
      else if (e.r.tier === 3) warn = '<p class="c-warn gv-marg">You moved off the safe picks. This one is “Beyond us”.</p>';
      else if (e.r.tier === 2 && p.idx === 0) warn = '<p class="c-warn gv-marg">The closest fit is “Dangerous”. No safe job is on the board for this band.</p>';
      h = '<div class="c-job" data-plan="' + i + '" data-q="' + e.q.id + '"><p class="a-oh">' + (p.idx === 0 ? 'The guild’s pick for Band ' + (i + 1) : 'Your pick for Band ' + (i + 1)) + '</p>' +
        '<p class="a-jn">' + e.q.name + '</p><p class="a-meta">' + meta(e.q) + '</p>' + GV.word(e.r) +
        '<div class="gv-notice-stats"><div class="gv-nstat"><b>PAY</b><span>' + GV.money(e.q.gold) + 'g</span></div><div class="gv-nstat"><b>XP</b><span>' + e.q.xp + '</span></div>' +
        '<div class="gv-nstat"><b>WIN ODDS</b><span>' + o.win + '<small> of ' + o.n + '</small></span></div></div>' +
        '<p class="a-wipe">' + GV.oddsLine(o) + '</p>' + warn +
        '<p class="a-other">Band ' + (other + 1) + ' reads this job as: ' + GV.word(GV.read(e.q.ch, GV.lv(other))) + '</p></div>' +
        '<div class="c-ctl"><p class="c-cyc">Job ' + (p.idx + 1) + ' of ' + p.n + '</p><div class="c-cycb"><button class="gv-btn mk-tiny" data-act="cycle" data-band="' + i + '" data-dir="-1">◂ Back</button> ' +
        '<button class="gv-btn mk-tiny" data-act="cycle" data-band="' + i + '" data-dir="1">Next job ▸</button></div>' +
        '<button class="gv-btn gv-btn--ghost mk-tiny" data-act="skip" data-band="' + i + '">Stay home this week</button></div>';
    }
    return '<div class="c-row' + (p.out ? ' is-out' : '') + '" data-row="' + i + '">' + who(i) + h + '</div>';
  }
  function foot(ps) {
    var s = GV.s, go = [], gold = 0, xp = 0;
    ps.forEach(function (p, i) { if (p.e) { go.push(i); gold += p.e.q.gold; xp += p.e.q.xp; } });
    var outN = s.out.filter(function (x) { return x != null; }).length;
    if (!go.length) return '<div class="c-foot"><p class="mk-bad" style="margin:0">' + (outN === GV.PARTY_COUNT ? 'Every band is out. Next: Advance Week.' : 'No band is set to go.') + '</p></div>';
    var label = go.length === GV.PARTY_COUNT ? 'Send both bands ▸' : 'Send Band ' + (go[0] + 1) + ' ▸';
    var what = go.map(function (i) { return 'Band ' + (i + 1) + ' → ' + ps[i].e.q.name; }).join('  ·  ');
    return '<div class="c-foot"><div><button class="gv-btn gv-btn--seal mk-big" data-act="sendall" data-orders="' + go.length + '">' + label + '</button></div>' +
      '<div class="c-what"><p><b>What happens:</b> ' + what + '. Each band takes its job and launches.</p><p class="mk-dim">If all win: +' + GV.money(gold) + 'g · +' + GV.money(xp) + ' xp. Nobody can be moved after.</p></div></div>';
  }
  function mvBtn(h, to, label) {
    var c = GV.canMove(h, to === 'hall' ? null : to);
    return '<button class="gv-btn mk-tiny" data-act="move" data-hero="' + h.id + '" data-to="' + to + '"' + (c.ok ? '' : ' disabled title="' + c.why + '"') + '>' + label + '</button>';
  }
  function hallSheet() {
    var hs = GV.hall(), li = '';
    hs.forEach(function (h, k) {
      var b = '';
      for (var i = 0; i < GV.PARTY_COUNT; i++) {
        var a = GV.lvIf(h, i), n = GV.lv(i);
        b += mvBtn(h, i, '+ Band ' + (i + 1) + ' <small>(level ' + (a === n ? 'stays ' + n : n + ' → ' + a) + ')</small>');
      }
      li += '<li class="c-hh" data-hero="' + h.id + '">' + GV.face(h, k + 1) + '<span class="a-hn"><b>' + h.name + '</b><small>' + h.anc + ' ' + h.cls + ' · L' + h.lv + '</small></span><span class="c-hb">' + b + '</span></li>';
    });
    return '<section class="gv-sheet gv-sheet--aged c-hall" data-section="hall" style="--gv-tilt:0.1deg"><span class="gv-tape"></span><h3 class="gv-head">Waiting at the hall <span class="gv-sub">' + hs.length + ' in reserve · the plan updates when you add them</span></h3>' +
      (hs.length ? '<ul class="c-hlist">' + li + '</ul>' : '<p class="mk-dim" style="margin:0">Nobody is waiting.</p>') + '</section>';
  }
  function rosterSheet() {
    var s = GV.s, open = !!s.ui.roster;
    var sum = '<button class="gv-btn" data-act="fold" data-f="roster" aria-expanded="' + open + '">' + (open ? '▾' : '▸') + ' Who is in each band</button> <span class="mk-dim">Band 1: ' + GV.members(0).length + ' · Band 2: ' + GV.members(1).length + ' · Hall: ' + GV.hall().length + '</span>';
    var body = '';
    if (open) {
      var col = function (title, list, bi) {
        var out = bi !== null && s.out[bi] != null, li = '';
        list.forEach(function (h) {
          var b = '';
          if (out) b = '<span class="a-lock">' + LOCK + ' locked</span>';
          else { for (var j = 0; j < GV.PARTY_COUNT; j++) if (j !== bi) b += mvBtn(h, j, '→ ' + (j + 1)); if (bi !== null) b += mvBtn(h, 'hall', '↓ Hall'); }
          li += '<li class="c-rr"><span class="a-hn"><b>' + h.name + '</b><small>' + h.cls + ' L' + h.lv + '</small></span><span class="c-hb">' + b + '</span></li>';
        });
        return '<div class="c-col"><h4>' + title + '</h4><ul>' + li + '</ul></div>';
      };
      body = '<div class="c-cols">' + col('Band 1 · level ' + GV.lv(0), GV.members(0), 0) + col('Band 2 · level ' + GV.lv(1), GV.members(1), 1) + col('At the hall', GV.hall(), null) + '</div>';
    }
    return '<section class="gv-sheet c-fold" data-section="roster" style="--gv-tilt:-0.1deg"><span class="gv-pin gv-pin--left"></span>' + sum + body + '</section>';
  }
  function allSheet() {
    var s = GV.s, open = !!s.ui.all;
    var sum = '<button class="gv-btn" data-act="fold" data-f="all" aria-expanded="' + open + '">' + (open ? '▾' : '▸') + ' Every job, as each band sees it</button> <span class="mk-dim">read only — to check the guild’s picks</span>';
    var body = '';
    if (open) {
      var qs = GV.QUESTS.slice().sort(function (a, b) { return a.ch - b.ch || a.id - b.id; });
      body = '<table class="c-tab"><colgroup><col style="width:34%"><col style="width:33%"><col style="width:33%"></colgroup><thead><tr><th>Job</th><th>Band 1 · level ' + GV.lv(0) + '</th><th>Band 2 · level ' + GV.lv(1) + '</th></tr></thead><tbody>';
      qs.forEach(function (x) {
        body += '<tr><td><b>' + x.name + '</b><small>challenge ' + x.ch + ' · ' + x.xp + ' xp</small></td><td>' + GV.word(GV.read(x.ch, GV.lv(0))) + '</td><td>' + GV.word(GV.read(x.ch, GV.lv(1))) + '</td></tr>';
      });
      body += '</tbody></table>';
    }
    return '<section class="gv-sheet gv-sheet--aged c-fold" data-section="all" style="--gv-tilt:0.1deg"><span class="gv-tape"></span>' + sum + body + '</section>';
  }
  function render() {
    var ps = plan(), rows = '';
    ps.forEach(function (p, i) { rows += row(i, p); });
    root.innerHTML = GV.banner('VARIANT C · THE WEEK PLAN', 'This week’s orders',
      'The guild has picked a job for each band. Change one if you like. <b>One click</b> sends them all.') +
      GV.deskbar() + GV.controls() +
      '<section class="gv-sheet c-plan" data-section="plan" style="--gv-tilt:-0.1deg"><span class="gv-pin"></span><h3 class="gv-head">Orders for week ' + GV.WEEK + ' <span class="gv-sub">' + GV.PARTY_COUNT + ' bands · 3rd band locked until Barracks level 3</span></h3>' +
      rows + foot(ps) + '</section>' + hallSheet() + rosterSheet() + allSheet() +
      '<p class="mk-foot"><b>Sample data.</b> Win odds are sample numbers from <code>forecast(job, config, 20, band)</code>. The guild’s pick = most XP among jobs that are not “Beyond us”, safe ones first; Band 2 chooses from what Band 1 leaves.</p>';
  }
  GV.wire({
    move: function (d) { var ok = GV.move(d.hero, d.to === 'hall' ? null : +d.to); if (ok) { GV.s.ui.pick0 = 0; GV.s.ui.pick1 = 0; } return ok; },
    cycle: function (d) { var i = +d.band, p = plan()[i]; if (!p.e) return false; GV.s.ui['pick' + i] = (p.idx + (+d.dir) + p.n) % p.n; },
    skip: function (d) { GV.s.ui['skip' + d.band] = !GV.s.ui['skip' + d.band]; },
    fold: function (d) { GV.s.ui[d.f] = !GV.s.ui[d.f]; },
    sendall: function () { var ps = plan(); ps.forEach(function (p, i) { if (p.e) GV.send(i, p.e.q.id); }); GV.s.ui.pick0 = 0; GV.s.ui.pick1 = 0; }
  }, render);
  GV.init('start'); render();
})();
</script></body></html>
