/**
 * Guild Vigil design tokens — brief #8 "The Cartographer's Table" (APPROVED 2026-08-10).
 * SINGLE SOURCE for the art direction: components consume tokens, never raw values.
 *
 * Two hard rules enforced by tests/ui/tokens.test.ts:
 *  - The status set is FROZEN (#0ca30c/#fab219/#ec835a/#d03b3b), always label-paired,
 *    never themed. It appears here ONCE; everything else must use var(--gv-s*).
 *  - Zero image assets in the UI layer: every url() in src/ui/styles is a data: URI
 *    (feTurbulence grain, inline SVG). Generated art arrives later as content, not chrome.
 */
:root {
  /* leather (the desk) */
  --gv-desk: #2a211c;
  --gv-desk-warm: #322822;
  --gv-desk-edge: #191210;
  --gv-desk-bar: #241c16;

  /* vellum ages — information age: fresh = current, aged = standing, old = history */
  --gv-vellum: #ece0c2;
  --gv-vellum-aged: #e2d2a8;
  --gv-vellum-old: #d8c494;
  --gv-vellum-edge: #b3a075;

  /* ink */
  --gv-ink: #3a2d1c;
  --gv-ink-soft: #5c4a30;
  --gv-ink-muted: #7d6a4c;
  --gv-ink-faint: #a89370;

  /* red ink = the world talking back; wax = irreversible commitment */
  --gv-red-ink: #9c3428;
  --gv-wax: #8c2f28;
  --gv-wax-hi: #a63d2f;
  --gv-wax-lo: #6e1f18;

  /* brass = actionable hardware (pins, plates, plaque) */
  --gv-brass-hi: #c9a86a;
  --gv-brass-mid: #a4854c;
  --gv-brass-deep: #8a6c38;
  --gv-brass-lo: #6e5426;
  --gv-brass-edge: #55401c;

  /* chart ink (step 5) — the surveyor's green for forest masses; everything
     else on the chart draws with the ink/red tokens above */
  --gv-chart-forest: #4a5230;

  /* the art plate (bible §2): every generated image is painted on this flat
     slate, so pastes and the sketch-pending silhouette share one ground */
  --gv-slate: #2e3138;

  /* FROZEN validated status set — label-paired ALWAYS, never themed, never alone */
  --gv-s0: #0ca30c; /* quiet / ready / success        */
  --gv-s1: #fab219; /* caution / resting / attention  */
  --gv-s2: #ec835a; /* threatened / wounded / warning */
  --gv-s3: #d03b3b; /* overrun / critical / failure   */

  /* ── THE SIX SEMANTIC CHANNELS (brief #24) ──────────────────────────────
     One vocabulary shared by the combat record and the character sheet, so a
     red stripe in the log and a red bar on the sheet mean the same thing.

     ⚠ DISTINCT IN LIGHTNESS, NOT ONLY HUE. Chosen so they stay separable
     under the common colour-blindness simulations and in greyscale; every
     use in the UI additionally pairs them with a word or a border style, so
     colour is reinforcement and never the sole carrier (WCAG 1.4.1).

     ⚠ NOT the --gv-s* set. Those four are the FROZEN status ramp (brief #8)
     and mean severity; these mean CATEGORY. Keeping them separate is why a
     critical hit can be 'exceptional' rather than 'more severe than a hit'. */
  --gv-ch-defence: #2f6b8f;     /* our side holding, reactions, saves */
  --gv-ch-harm: #9c3428;        /* damage dealt, hits landed          */
  --gv-ch-magic: #6b4c8f;       /* spells, conditions, control        */
  --gv-ch-resource: #3f6d2e;    /* healing, loot, resources gained    */
  --gv-ch-exceptional: #8a6c38; /* criticals — its own channel        */
  --gv-ch-inert: #8a7a5c;       /* nothing happened; may be skipped   */
  --gv-ch-slain: #7d2820;       /* a unit died                        */

  /* textures — feTurbulence data-URIs (zero image assets, per brief) */
  /* Brief #11: was baseFrequency 0.055 / opacity 0.16. Over a 300px tile that
     is a ~18px feature size, which at full-viewport scale reads as smeared
     cloud rather than leather — the "artifacts" on the title screen. 0.5 puts
     the grain at ~2px where it belongs; the lower opacity keeps it from
     dirtying the deep areas the vignette already darkens. */
  --gv-tex-leather: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='l'><feTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23l)' opacity='0.10'/></svg>");
  /* Brief #11: was baseFrequency 0.012 / opacity 0.10 — an ~83px feature size,
     which is the LARGE blotching on the desk (the fine layer above was only
     half the story). Broad tonal variation is wanted here, so the fix is scale
     and weight, not removal: smaller features, and light enough to read as
     hide rather than as staining. */
  --gv-tex-leather-coarse: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.05' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='700' height='700' filter='url(%23g)' opacity='0.06'/></svg>");
  --gv-tex-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23p)' opacity='0.5'/></svg>");
  --gv-tex-fiber: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23f)' opacity='0.05'/></svg>");
  --gv-tex-felt: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='f2'><feTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23f2)' opacity='0.2'/></svg>");

  /* type — brief #9 program: Alegreya (text voice) + Alegreya Sans SC (label
     voice), embedded as data-URI @font-face in fonts.css (machine-generated by
     tools/build-fonts.mjs). Old stand-ins remain as the fallback chain. */
  --gv-serif: 'Alegreya', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  --gv-sans: 'Alegreya Sans SC', 'Segoe UI', system-ui, sans-serif;

  /* shape + depth */
  --gv-radius-sheet: 2px 3px 2px 3px;
  --gv-shadow-sheet: 0 4px 12px #00000059, 0 1px 3px #00000040;
  --gv-shadow-lift: 0 9px 22px #00000073, 0 2px 5px #00000040;
  --gv-shadow-hardware: 0 2px 3px #00000088, inset 0 -1px 2px #00000055;

  /* motion */
  --gv-lift: 0.16s ease;
}

/**
 * Readable type — brief #9's second accessibility contract, the typographic
 * sibling of flat mode and INDEPENDENT of it (players keep the leather desk).
 * Both voices swap to Atkinson Hyperlegible; component-level relaxations
 * (italics off, tracking to zero, taller lines) live in components.css.
 */
body.gv-readable {
  --gv-serif: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif;
  --gv-sans: 'Atkinson Hyperlegible', Verdana, system-ui, sans-serif;
}

/**
 * Materials — the physical surfaces of the Cartographer's Table (brief #8).
 * The desk (leather), the vellum sheet system (three ages + stains + deckle),
 * the blotter pad, ledger ruling. Consumes tokens.css only.
 *
 * Flat mode: `body.gv-flat` strips tilt/grain/clip while keeping the full grid,
 * all data, and all labels (brief #8 accessibility contract). Persistence of the
 * setting goes through SaveStore when SettingsScreen converts (rollout step 7) —
 * until then callers may only toggle the class.
 */

/* ============ the desk ============ */
.gv-desk {
  font-family: var(--gv-serif);
  color: var(--gv-ink);
  background-color: var(--gv-desk);
  /* The leather lives on ::before (below), not on this box. */
  position: relative;
  isolation: isolate;
}
/*
 * PERFORMANCE (Track P). The leather used to be this box's own background with
 * `background-attachment: fixed`. A fixed background cannot be scrolled by the
 * compositor: the browser repaints the whole viewport of gradients and noise
 * on every scroll step. That was the "laggy" scrolling on the dispatch and
 * after-action screens (measured: 3x the raster time, see tools/perf-scroll.mjs).
 *
 * Same picture, different mechanism: a viewport-sized `position: fixed` layer
 * behind the content. `will-change: transform` makes it its own compositor
 * layer, painted once and then only moved. Scrolling no longer repaints it.
 */
.gv-desk::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  will-change: transform;
  background:
    radial-gradient(120% 90% at 50% 0%, #00000000 55%, #00000066 100%),
    var(--gv-tex-leather),
    var(--gv-tex-leather-coarse),
    linear-gradient(160deg, var(--gv-desk-warm), var(--gv-desk) 40%, #211a15);
}

/* tooled + stitched work-area border (materials v2) */
.gv-desk-area {
  position: relative;
  border: 2px dashed #4a3a2c55;
  border-radius: 14px;
}
.gv-desk-area::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 20px;
  border: 1px solid #00000055;
  box-shadow: inset 0 0 60px #00000066, inset 0 0 0 3px #00000022, inset 0 0 0 4px #c9a86a14;
  pointer-events: none;
}
.gv-desk-area::after {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 17px;
  border: 1.5px dashed #6b583655;
  pointer-events: none;
}

/* ============ the vellum sheet system ============ */
.gv-sheet {
  position: relative;
  background:
    radial-gradient(140% 110% at 30% 20%, #ffffff26 0%, #00000000 55%),
    radial-gradient(120% 120% at 50% 50%, #00000000 62%, #6e50281f 100%),
    var(--gv-tex-fiber),
    var(--gv-pv, var(--gv-vellum));
  color: var(--gv-ink);
  padding: 18px 22px;
  border: 1px solid var(--gv-vellum-edge);
  border-radius: var(--gv-radius-sheet);
  box-shadow: var(--gv-shadow-sheet);
  transform: rotate(var(--gv-tilt, 0deg));
  transition: transform var(--gv-lift), box-shadow var(--gv-lift);
}
.gv-sheet::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: var(--gv-tex-grain);
  opacity: 0.14;
  mix-blend-mode: multiply;
}
.gv-sheet:hover {
  transform: rotate(0deg) translateY(-2px);
  box-shadow: var(--gv-shadow-lift);
}
/* PERFORMANCE: no hover lift while the page scrolls — see scrollQuiet.ts. The
   sheet holds its resting pose, so scrolling repaints nothing. */
body.gv-scrolling .gv-sheet,
body.gv-scrolling .gv-sheet:hover {
  transform: rotate(var(--gv-tilt, 0deg));
  box-shadow: var(--gv-shadow-sheet);
  transition: none;
}
.gv-sheet--aged { --gv-pv: var(--gv-vellum-aged); }
.gv-sheet--old  { --gv-pv: var(--gv-vellum-old); }
.gv-sheet--stained::after {
  content: "";
  position: absolute;
  right: 8%;
  bottom: 10%;
  width: 90px;
  height: 74px;
  border-radius: 50% 60% 55% 45%;
  pointer-events: none;
  background: radial-gradient(closest-side, #6e502800 40%, #6e502822 78%, #6e502800 100%);
}
/* deckled edge — the OLDEST sheets only (locked decision, brief #8) */
.gv-sheet--deckle {
  clip-path: polygon(0.6% 1.8%, 6% 0.4%, 14% 1.6%, 24% 0.2%, 36% 1.4%, 47% 0.3%, 58% 1.6%, 70% 0.4%, 82% 1.5%, 93% 0.3%, 99.5% 2%, 99.7% 12%, 99% 26%, 99.8% 41%, 99.1% 57%, 99.8% 72%, 99% 86%, 99.6% 97.8%, 92% 99.6%, 80% 98.6%, 67% 99.7%, 54% 98.5%, 41% 99.7%, 28% 98.6%, 15% 99.6%, 5% 98.4%, 0.4% 97.6%, 1% 84%, 0.2% 68%, 1% 52%, 0.3% 36%, 1% 20%);
}

/* torn lower edge for board notices */
.gv-sheet--notice {
  clip-path: polygon(0 0, 100% 0, 100% 94%, 96% 97%, 88% 95%, 78% 99%, 66% 96%, 55% 99%, 42% 96%, 30% 99%, 18% 96%, 8% 99%, 0 95%);
}

/*
 * PERFORMANCE: on the long screens (dispatch playback, after-action) each sheet
 * is its own compositor layer. Scrolling then moves finished pictures of the
 * sheets instead of repainting their grain, gradients and shadows. Scoped to
 * those two screens so the short screens do not pay the layer memory. The
 * sheet's blend layer only blends INSIDE the sheet (it is a stacking context
 * already), so the look is the same. Flat mode has no tilt or grain, so it
 * does not need the layer.
 */
.gv-run .gv-sheet,
.gv-aar .gv-sheet {
  will-change: transform;
}
body.gv-flat .gv-run .gv-sheet,
body.gv-flat .gv-aar .gv-sheet {
  will-change: auto;
}

/* ============ blotter pad (ambience furniture under correspondence) ============ */
.gv-pad {
  position: relative;
}
.gv-pad::before {
  content: "";
  position: absolute;
  inset: -9px -7px 9px -9px;
  border-radius: 4px;
  background: var(--gv-tex-felt), linear-gradient(165deg, #33402f, #232d21);
  border: 1px solid #00000088;
  box-shadow: 0 3px 8px #00000059, inset 0 1px 0 #ffffff10;
  transform: rotate(-0.4deg);
}

/* ============ screen title on the leather ============ */
.gv-desk h1 {
  font-size: 21px;
  letter-spacing: 0.5px;
  color: #d8bd85;
  text-shadow: 0 1px 2px #000000cc;
  margin: 0 0 12px;
  font-weight: 400;
}

/* ============ ledger ruling + ledger tables ============ */
.gv-ledger {
  background-image: repeating-linear-gradient(#00000000 0 27px, #8c6a3a22 27px 28px);
  line-height: 28px;
}
.gv-ledger table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  line-height: 28px;
}
.gv-ledger th {
  text-align: left;
  font-family: var(--gv-sans);
  font-size: 10px;
  letter-spacing: 1.6px;
  /* no uppercase transform — SC face renders true mixed small caps (brief #9) */
  color: var(--gv-ink-muted);
  font-weight: 600;
  padding: 0 8px 0 0;
}
.gv-ledger td {
  padding: 0 8px 0 0;
  vertical-align: middle;
}

/* ============ flat mode (materials) ============ */
body.gv-flat .gv-sheet,
body.gv-flat .gv-sheet:hover {
  transform: none;
}
body.gv-flat .gv-sheet::before {
  display: none;
}
body.gv-flat .gv-sheet--deckle {
  clip-path: none;
}
body.gv-flat .gv-pad::before {
  display: none;
}

/**
 * Desk-grammar components — the load-bearing vocabulary (brief #8, normative):
 *   pin = actionable now · tape = standing record · wax seal = irreversible
 *   commitment · red ink = the world talking back (marginalia / stamp / thread)
 *   · vellum age = information age. One meaning per affordance, no exceptions.
 * Status chips use ONLY the frozen --gv-s* tokens and are always label-paired.
 */

/* ============ hardware: pin + tape ============ */
.gv-pin {
  position: absolute;
  top: -6px;
  left: 50%;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, var(--gv-brass-hi), var(--gv-brass-deep) 55%, var(--gv-brass-lo));
  box-shadow: var(--gv-shadow-hardware);
  z-index: 2;
}
.gv-pin--left { left: 18px; }
.gv-pin--right { left: auto; right: 18px; }
/* driven THROUGH the sheet rather than straddling its edge — a pin half on and
   half off the paper reads as an artifact, not as hardware (brief #11) */
.gv-pin--inset { top: 9px; left: 14px; }

.gv-tape {
  position: absolute;
  top: -9px;
  width: 74px;
  height: 20px;
  left: 50%;
  transform: translateX(-50%) rotate(-1.5deg);
  background: #d8ccaa99;
  border-left: 1px dashed #00000022;
  border-right: 1px dashed #00000022;
  box-shadow: 0 1px 2px #00000033;
  z-index: 2;
}

/* ============ headings ============ */
.gv-head {
  font-size: 16.5px;
  letter-spacing: 0.4px;
  margin: 0 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #b3a07588;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.gv-head .gv-sub {
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.8px;
  /* no uppercase transform — the SC face renders true mixed small caps (brief #9) */
  color: var(--gv-ink-muted);
}

/* ============ buttons: plain / seal (commitment) / ghost ============ */
.gv-btn {
  font-family: var(--gv-serif);
  font-size: 13.5px;
  padding: 6px 14px;
  cursor: pointer;
  background: #e2d4b2;
  color: var(--gv-ink);
  border: 1px solid #a8905e;
  border-radius: 2px;
  box-shadow: 0 1px 0 #00000022;
}
.gv-btn:hover { background: #d9c9a2; }
.gv-btn:disabled {
  background: #cbb98d;
  box-shadow: inset 0 1px 3px #00000033;
  color: var(--gv-ink-soft);
  cursor: default;
}
.gv-btn--seal:disabled {
  filter: saturate(0.5) brightness(0.85);
  cursor: default;
}
.gv-btn--seal:disabled:hover { filter: saturate(0.5) brightness(0.85); }
.gv-btn--seal {
  background: linear-gradient(160deg, var(--gv-wax-hi), var(--gv-wax));
  color: #f4ecd8;
  border-color: var(--gv-wax-lo);
  text-shadow: 0 1px 1px #00000055;
}
.gv-btn--seal:hover { filter: brightness(1.07); }
.gv-btn--ghost {
  background: transparent;
  border-style: dashed;
  color: var(--gv-ink-muted);
}

/* ============ status chip — color + label, inseparable ============ */
.gv-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  white-space: nowrap;
}
.gv-chip i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid #00000038;
  box-shadow: inset 0 1px 1px #ffffff44;
}
.gv-chip--s0 i { background: var(--gv-s0); }
.gv-chip--s1 i { background: var(--gv-s1); }
.gv-chip--s2 i { background: var(--gv-s2); }
.gv-chip--s3 i { background: var(--gv-s3); }

/* ============ meter (watch report) — bar inherits the chip's status ============ */
.gv-meter {
  display: grid;
  grid-template-columns: 104px 118px 1fr auto;
  gap: 10px;
  align-items: center;
  font-size: 12.5px;
  line-height: 26px;
}
.gv-meter .gv-bar {
  height: 8px;
  border-radius: 2px;
  background: #cbb98d66;
  overflow: hidden;
}
.gv-meter .gv-bar i { display: block; height: 100%; }
.gv-bar--s0 i { background: var(--gv-s0); }
.gv-bar--s1 i { background: var(--gv-s1); }
.gv-bar--s2 i { background: var(--gv-s2); }
.gv-bar--s3 i { background: var(--gv-s3); }

/* ============ red ink: stamp + marginalia ============ */
.gv-stamp {
  position: absolute;
  top: 34px;
  right: -8px;
  transform: rotate(8deg);
  font-family: var(--gv-sans);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2.5px;
  color: var(--gv-red-ink);
  border: 2.5px solid var(--gv-red-ink);
  padding: 3px 9px;
  border-radius: 3px;
  opacity: 0.7;
  mix-blend-mode: multiply;
}
.gv-marg {
  color: var(--gv-red-ink);
  font-style: italic;
  font-size: 12px;
}

/* the clerk's own note on a file — same margin voice, NOT red ink. Red ink is
   reserved for the world talking back; "awaiting field sketch" is the archive
   admitting a gap, and an instruction is never the world's voice at all. */
.gv-filenote {
  color: var(--gv-ink-muted);
  font-size: 12px;
}

/* ============ wax seal medallion ============ */
.gv-seal {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 36% 30%, #b8504040, #00000000 60%),
    radial-gradient(circle at 50% 55%, var(--gv-wax-hi), #7a241c 70%, #5c1712);
  box-shadow: 0 2px 5px #00000066, inset 0 0 0 5px #00000022, inset 0 0 0 10px #ffffff14;
  display: grid;
  place-items: center;
  color: #e8c9b0;
  font-size: 17px;
  transform: rotate(-6deg);
}

/* ============ xp / progress (non-status, brass-toned) ============ */
.gv-xp {
  height: 6px;
  background: #cbb98d66;
  border-radius: 2px;
  overflow: hidden;
}
.gv-xp i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gv-brass-deep), var(--gv-brass-lo));
}

/* ============ portrait frame (daguerreotype-on-vellum mount) ============ */
.gv-portrait {
  display: block;
  border: 1px solid #a8905e;
  box-shadow: 0 2px 4px #00000040, inset 0 0 0 2px #f4ecd8;
  background: #23262e;
  transform: rotate(-1.2deg);
}
.gv-portrait--r2 { transform: rotate(0.9deg); }

/* ============ deskbar: plaque + brass plates (explicit numbers) ============ */
.gv-deskbar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  background: var(--gv-tex-leather), linear-gradient(175deg, var(--gv-desk-bar), var(--gv-desk-edge));
  border: 1px solid #000000aa;
  border-radius: 4px;
  padding: 10px 16px;
  box-shadow: 0 3px 8px #00000066, inset 0 1px 0 #ffffff12, inset 0 0 0 2px #c9a86a10;
}
.gv-plaque {
  font-size: 17px;
  letter-spacing: 3px;
  color: #d8bd85;
  text-shadow: 0 1px 1px #000000cc;
  padding: 3px 14px;
  border: 1px solid var(--gv-brass-lo);
  border-radius: 3px;
  background: linear-gradient(160deg, #4a3a1e, #2e2412);
  box-shadow: inset 0 1px 0 #c9a86a33, 0 1px 2px #000000aa;
}
.gv-plate {
  font-family: var(--gv-sans);
  font-size: 11px;
  letter-spacing: 1.6px;
  color: #2a1f0e;
  background: linear-gradient(160deg, var(--gv-brass-hi), var(--gv-brass-mid) 60%, var(--gv-brass-deep));
  border: 1px solid var(--gv-brass-edge);
  border-radius: 2px;
  padding: 3px 10px;
  box-shadow: inset 0 1px 0 #ffffff55, 0 1px 2px #000000aa;
}
.gv-plate b { font-size: 12.5px; letter-spacing: 0.5px; }

/* ============ scribe's tally ============ */
.gv-tallyrow {
  display: grid;
  grid-template-columns: 74px 1fr 44px;
  gap: 10px;
  align-items: center;
  font-size: 13px;
}
.gv-tally {
  display: flex;
  gap: 9px;
  align-items: center;
  height: 22px;
}
.gv-tally svg { display: block; }
.gv-tno {
  color: var(--gv-ink-muted);
  text-align: right;
  font-size: 12.5px;
}

/* ============ ink input (charter fields) ============ */
.gv-input {
  font-family: var(--gv-serif);
  font-size: 13.5px;
  color: var(--gv-ink);
  background: #f4ecd8aa;
  border: 1px solid #a8905e;
  border-radius: 2px;
  padding: 6px 10px;
}
.gv-input:focus {
  outline: 2px solid var(--gv-brass-deep);
  outline-offset: 1px;
}
.gv-input::placeholder {
  color: var(--gv-ink-muted);
  font-style: italic;
}

/* ============ ambience layer (accessories) ============ */
.gv-acc {
  position: absolute;
  pointer-events: none;
  z-index: 4;
  filter: drop-shadow(0 4px 4px #00000073);
}
.gv-acc svg { display: block; }
.gv-thread-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

/* pounce-pot resolution shimmer — fires when the sand re-keys on week advance */
.gv-acc-sand {
  animation: gv-sand 0.9s ease-out 1;
}
@keyframes gv-sand {
  0% { opacity: 0; transform: translateY(-6px); }
  60% { opacity: 1; }
  100% { transform: none; }
}

/* the red thread (spool → chart X) — drawn in the chart SVG */
.gv-thread path {
  stroke: var(--gv-red-ink);
  fill: none;
}
.gv-thread circle {
  fill: var(--gv-brass-deep);
}

/* ============ flat mode (components + ambience) ============ */
body.gv-flat .gv-stamp { transform: none; }
body.gv-flat .gv-portrait { transform: none; }
body.gv-flat .gv-acc,
body.gv-flat .gv-thread,
body.gv-flat .gv-thread-overlay { display: none; }

/* ============ readable type (brief #9 — typographic flat mode) ============
   Token swap happens in tokens.css (body.gv-readable). Here: the spacing and
   letterform relaxations the dyslexia guidance actually supports — italics
   off, tracking to zero, taller body lines. Data, labels, and layout intact.
   KEEP IN SYNC: the selector list below is every tracked/italic text site. */
/* decorative italics carry a class, never an inline style, so readable mode
   can reach them (inline styles would win the cascade) */
.gv-italic { font-style: italic; }
body.gv-readable .gv-desk { line-height: 1.55; }
body.gv-readable .gv-italic,
body.gv-readable .gv-marg,
body.gv-readable .gv-input::placeholder,
body.gv-readable .gv-chart-redtext,
body.gv-readable svg text,
body.gv-readable .gv-feed .gv-beat[data-tone='loot'] { font-style: normal; }
body.gv-readable .gv-head,
body.gv-readable .gv-head .gv-sub,
body.gv-readable .gv-stamp,
body.gv-readable .gv-plaque,
body.gv-readable .gv-plate,
body.gv-readable .gv-plate b,
body.gv-readable .gv-ledger th,
body.gv-readable .gv-notice-id,
body.gv-readable .gv-notice-foot,
body.gv-readable .gv-difficulty,
body.gv-readable .gv-nstat b,
body.gv-readable .gv-slotsub,
body.gv-readable .gv-namefield label,
body.gv-readable .gv-ordercard b,
body.gv-readable .gv-xptable th,
body.gv-readable .gv-whosub,
body.gv-readable .gv-dname,
body.gv-readable .gv-dstat,
body.gv-readable .gv-rollcls,
body.gv-readable .gv-mname,
body.gv-readable .gv-reward,
body.gv-readable .gv-slot-empty,
body.gv-readable .gv-abilities .gv-ab b,
body.gv-readable .gv-choice .gv-choice-label,
body.gv-readable .gv-title h1 { letter-spacing: 0; }

/* M2: plain dropdowns in the desk's type (spell page rules) */
.gv-select {
  font: inherit;
  font-size: 13.5px;
  color: var(--gv-ink);
  background: #f3e9d2;
  border: 1px solid #8a734f;
  border-radius: 4px;
  padding: 2px 6px;
}

/**
 * Per-screen desk layouts (brief #8 rollout, one block per converted screen).
 * Vocabulary lives in components.css; this file only arranges sheets on the desk.
 * Breakpoint rule (locked decision): content column grows first; single column
 * below 980px.
 */

/* ============ rollout step 2: Town Hub ============ */
.gv-town {
  position: relative; /* the accessory layer anchors here (step 7) */
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 0 22px;
  align-items: start;
  max-width: 1140px;
  margin: 0 auto;
}
.gv-town-full { grid-column: 1 / -1; }
@media (max-width: 980px) {
  .gv-town { grid-template-columns: 1fr; }
}

.gv-town .gv-sheet { margin-bottom: 22px; }

/* ============ rollout step 3: Quest Board ============ */
.gv-board {
  max-width: 1140px;
  margin: 0 auto;
}
.gv-notices {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.gv-notices .gv-sheet--notice {
  width: 300px;
  margin: 0;
  padding-bottom: 24px;
  font-size: 13px;
}
/* deterministic hand-placement: nth-child tilt, no randomness */
.gv-notices .gv-sheet--notice:nth-child(3n+1) { --gv-tilt: -0.7deg; }
.gv-notices .gv-sheet--notice:nth-child(3n+2) { --gv-tilt: 0.8deg; }
.gv-notices .gv-sheet--notice:nth-child(3n)   { --gv-tilt: -0.4deg; }
/* brief #11 hierarchy: id tag → name → the guild's judgement → equal stat
   blocks in priority order → muted footer. */
.gv-notice-id {
  font-family: var(--gv-sans);
  font-size: 10px;
  letter-spacing: 1.6px;
  color: var(--gv-ink-faint);
}
.gv-notice-name {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.16;
  margin: 2px 0 0;
  padding-right: 26px;
}
/* a stamped notice reserves the stamp's column — red ink must never land
   across the posting's name (it did, before this brief) */
.gv-notice--stamped .gv-notice-id,
.gv-notice--stamped .gv-notice-name {
  padding-right: 104px;
}
.gv-notice--stamped .gv-stamp {
  top: 16px;
}

.gv-difficulty {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  margin: 9px 0 0;
  font-family: var(--gv-sans);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.09em;
}
.gv-difficulty i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid #00000038;
  box-shadow: inset 0 1px 1px #ffffff44;
  flex: none;
}
/* the frozen set, in its documented semantics: quiet · attention · warning ·
   critical. The word always ships with the colour. */
.gv-difficulty--s0 i { background: var(--gv-s0); }
.gv-difficulty--s1 i { background: var(--gv-s1); }
.gv-difficulty--s2 i { background: var(--gv-s2); }
.gv-difficulty--s3 i { background: var(--gv-s3); }
.gv-difficulty span {
  font-family: var(--gv-serif);
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0;
  color: var(--gv-ink-muted);
}

.gv-notice-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 13px 0 0;
}
.gv-nstat {
  border: 1px solid #a8905e;
  border-radius: 2px;
  background: #e2d4b266;
  padding: 5px 7px 6px;
  text-align: center;
}
.gv-nstat b {
  display: block;
  font-family: var(--gv-sans);
  font-size: 9.5px;
  letter-spacing: 1.5px;
  color: var(--gv-ink-muted);
  font-weight: 600;
}
.gv-nstat > span {
  display: block;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.28;
}
.gv-nstat small {
  font-size: 11.5px;
  font-weight: 400;
  color: var(--gv-ink-soft);
}
.gv-notice-foot {
  margin: 12px 0 0;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.1px;
  color: var(--gv-ink-muted);
}
.gv-notice-acts {
  margin: 13px 0 0;
}
.gv-reward {
  font-family: var(--gv-sans);
  font-size: 11px;
  letter-spacing: 1.5px;
  /* no uppercase transform — SC face renders true mixed small caps (brief #9) */
  border: 1.5px solid var(--gv-ink-soft);
  display: inline-block;
  padding: 2px 8px;
  border-radius: 2px;
  color: var(--gv-ink-soft);
}
.gv-slot-empty {
  width: 300px;
  border: 1.5px dashed #a8937055;
  border-radius: 3px;
  padding: 26px 12px;
  text-align: center;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.8px;
  /* no uppercase transform — SC face renders true mixed small caps (brief #9) */
  color: var(--gv-ink-faint);
  align-self: stretch;
  display: grid;
  place-items: center;
}

/* ============ rollout step 4: Hero Panel ============ */
.gv-hero {
  max-width: 940px;
  margin: 0 auto;
}
.gv-hero .gv-sheet { margin-bottom: 22px; }
.gv-hero .gv-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 0 0 20px;
}
/* the ability row: six brass-riveted stat blocks on the dossier */
.gv-abilities {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.gv-abilities .gv-ab {
  border: 1px solid #a8905e;
  border-radius: 2px;
  padding: 4px 10px;
  background: #e2d4b266;
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
}
.gv-abilities .gv-ab b {
  display: block;
  font-family: var(--gv-sans);
  font-size: 9.5px;
  letter-spacing: 1.6px;
  color: var(--gv-ink-muted);
}
.gv-statline {
  font-size: 13.5px;
  line-height: 1.7;
  margin: 0 0 6px;
}

/* ============ rollout step 5: the chart ============ */
.gv-chartwrap {
  max-width: 1140px;
  margin: 0 auto;
}
.gv-chart {
  padding: 10px 10px 4px;
}
.gv-chart svg {
  display: block;
  width: 100%;
  height: auto;
}
.gv-chart svg text {
  font-family: var(--gv-serif);
}
.gv-chart .gv-head {
  margin: 8px 12px 2px;
}
.gv-chart-note {
  font-size: 12.5px;
  color: var(--gv-ink-soft);
  line-height: 1.6;
  margin: 8px 12px 6px;
  /* ⚠ CLEARS THE THREAD SPOOL, which hangs off the sheet at left:-30 /
     bottom:34. The fog legend made this note long enough to wrap to a third
     line, and that line ran behind the spool so the sentence lost its first
     few words. Found by screenshot, not by reading the CSS. */
  padding-left: 3.25rem;
}

/* chart ink: geometry lives in the SVG, color lives here (tokens only) */
.gv-chart-ink {
  stroke: var(--gv-ink);
  fill: none;
}
.gv-chart-soft {
  stroke: var(--gv-ink-soft);
  fill: none;
}
.gv-chart-forest {
  stroke: var(--gv-chart-forest);
  fill: none;
}
.gv-chart-red {
  stroke: var(--gv-red-ink);
  fill: none;
}
.gv-chart-fill-ink {
  fill: var(--gv-ink);
}
.gv-chart-fill-soft {
  fill: var(--gv-ink-soft);
}
.gv-chart-text {
  fill: var(--gv-ink);
}
.gv-chart-redtext {
  fill: var(--gv-red-ink);
  font-style: italic;
}
.gv-chart-cartouche {
  fill: var(--gv-vellum);
  stroke: var(--gv-ink);
}
/* cartographic label halo: a vellum stroke painted UNDER the letterforms lifts
   every chart label off the linework it crosses (paint-order keeps ink on top) */
.gv-chart-halo {
  paint-order: stroke;
  stroke: var(--gv-vellum);
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

/* pressure wash: frozen status fill at low opacity — the paired red-ink
   annotation renders in the same group, never separately */
.gv-chart-wash {
  opacity: 0.1;
}
.gv-chart-wash--s0 { fill: var(--gv-s0); }
.gv-chart-wash--s1 { fill: var(--gv-s1); }
.gv-chart-wash--s2 { fill: var(--gv-s2); }
.gv-chart-wash--s3 { fill: var(--gv-s3); }

/* ============ rollout step 6: dispatch / playback / after-action ============ */
.gv-dispatch,
.gv-aar {
  max-width: 860px;
  margin: 0 auto;
}
.gv-run {
  max-width: 940px;
  margin: 0 auto;
}
.gv-dispatch .gv-sheet,
.gv-run .gv-sheet,
.gv-aar .gv-sheet {
  margin-bottom: 22px;
}
/* choice rows (profile / caution / speed): pressed = chosen (.gv-btn:disabled) */
.gv-choice {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 0 0 10px;
}
.gv-choice .gv-choice-label {
  font-family: var(--gv-sans);
  font-size: 10px;
  letter-spacing: 1.8px;
  /* no uppercase transform — SC face renders true mixed small caps (brief #9) */
  color: var(--gv-ink-muted);
  min-width: 74px;
}
/* ---- orders as cards (brief #11): the label plus one line of consequence.
   Sim ids never reach the screen; src/ui/labels.ts is the only translator. ---- */
.gv-ordergrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
  gap: 9px;
  margin: 6px 0 0;
}
.gv-ordercard {
  text-align: left;
  cursor: pointer;
  font-family: var(--gv-serif);
  color: var(--gv-ink);
  border: 1px solid #a8905e88;
  border-radius: 2px;
  background: #e2d4b244;
  padding: 9px 11px;
}
.gv-ordercard:hover { background: #e2d4b277; }
.gv-ordercard[aria-pressed='true'] {
  border-color: var(--gv-wax);
  box-shadow: inset 0 0 0 2px #8c2f2880;
  background: #e2d4b299;
}
.gv-ordercard b {
  display: block;
  font-family: var(--gv-sans);
  font-size: 12.5px;
  letter-spacing: 0.07em;
  font-weight: 700;
}
.gv-ordercard span {
  display: block;
  font-size: 12px;
  line-height: 1.4;
  color: var(--gv-ink-soft);
  margin-top: 2px;
}

/* ---- after-action: one row per hero, source as columns (brief #11) ---- */
.gv-xptable {
  margin-bottom: 10px;
}
.gv-xptable table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  line-height: 30px;
}
.gv-xptable th {
  text-align: left;
  font-family: var(--gv-sans);
  font-size: 10px;
  letter-spacing: 1.6px;
  color: var(--gv-ink-muted);
  font-weight: 600;
  border-bottom: 1px solid #b3a07577;
  padding: 0 10px 0 0;
}
.gv-xptable td { padding: 4px 10px 4px 0; }
/* the chip's default 52px overflows a 30px ledger row and the faces collide */
.gv-xptable .gv-paste--chip { width: 38px; }
/* tabular figures so the columns actually read as columns */
.gv-xptable th.gv-n,
.gv-xptable td.gv-n {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.gv-xptable td.gv-tot { font-weight: 700; }
.gv-xptable th.gv-prog,
.gv-xptable td.gv-prog {
  padding-left: 26px;
  white-space: nowrap;
}
.gv-xptable tfoot td {
  border-top: 1px solid #b3a07577;
  font-weight: 700;
}

/* the scribe's running record: ruled feed on fresh vellum */
/* ============ the record: six semantic channels (brief #24) ============
   ⚠ THE COLOUR LIVES IN A LEFT STRIPE, NOT IN THE TEXT.
   Colouring 13px body text is precisely what British Dyslexia Association
   guidance warns against — it lowers contrast on the glyphs a reader must
   actually decode. A 3px border-left carries the same signal at full
   saturation while the words stay high-contrast ink.

   ⚠ COLOUR IS NEVER ALONE (WCAG 1.4.1). Each tone below pairs with something
   non-chromatic: `inert` is dashed AND dimmed, `exceptional` is bold, `slain`
   is bold. Desaturate the screen and the record still reads.

   The channels match the character sheet exactly, so red means offence in
   both places and the player learns one vocabulary. */
.gv-feed {
  height: 280px;
  overflow-y: auto;
  line-height: 1.55;
  font-size: 13px;
}
.gv-feed .gv-beat {
  padding: 3px 8px 3px 9px;
  border-left: 3px solid transparent;
  margin-bottom: 1px;
}
.gv-feed .gv-beat small {
  color: var(--gv-ink-muted);
  font-family: var(--gv-sans);
  font-size: 10px;
  margin-right: 8px;
  font-variant-numeric: tabular-nums lining-nums;
}
/* numbers in the record line up as columns rather than drifting */
.gv-feed .gv-beat { font-variant-numeric: tabular-nums lining-nums slashed-zero; }

.gv-feed .gv-beat[data-tone='harm']        { border-left-color: var(--gv-ch-harm); background: #9c342809; }
.gv-feed .gv-beat[data-tone='defence']     { border-left-color: var(--gv-ch-defence); background: #2f6b8f0d; }
.gv-feed .gv-beat[data-tone='magic']       { border-left-color: var(--gv-ch-magic); background: #6b4c8f0d; }
.gv-feed .gv-beat[data-tone='resource']    { border-left-color: var(--gv-ch-resource); background: #3f6d2e0d; }
.gv-feed .gv-beat[data-tone='exceptional'] { border-left-color: var(--gv-ch-exceptional); background: #c9a86a2e; font-weight: 700; }
.gv-feed .gv-beat[data-tone='slain']       { border-left-color: var(--gv-ch-slain); background: #7d282010; font-weight: 700; }
/* nothing happened: dashed AND dimmed, so the eye skips it in any palette */
.gv-feed .gv-beat[data-tone='inert'] {
  border-left-style: dashed;
  border-left-color: var(--gv-ch-inert);
  color: var(--gv-ink-muted);
}
/* legacy tones, still used by travel/loot/dispatch lines */
.gv-feed .gv-beat[data-tone='bad'] { font-weight: 600; }
.gv-feed .gv-beat[data-tone='loot'] { font-style: italic; border-left-color: var(--gv-ch-resource); }
.gv-feed .gv-beat[data-tone='good'] { border-left-color: var(--gv-ch-resource); }
.gv-feed .gv-beat[data-tone='system'] { color: var(--gv-ink-muted); }
.gv-feed .gv-beat[data-tone='travel'] { color: var(--gv-ink-soft); }
/* the dungeon sketch: ink on vellum, same hand as the chart */
.gv-sketch svg {
  display: block;
  width: 100%;
  height: auto;
}

/* ============ remaining surfaces: title + shop ============ */
.gv-title {
  /* narrowed from 680px with the charter rebuild: the slot list has no wide
     column left to fill, and 600 keeps each row's name and action in one glance */
  max-width: 600px;
  margin: 0 auto;
}
.gv-title h1 {
  font-size: 34px;
  letter-spacing: 6px;
  text-align: center;
  margin-bottom: 4px;
}
.gv-title-motto {
  text-align: center;
  font-style: italic;
  color: var(--gv-ink-faint);
  margin: 0 0 26px;
}

/* ---- the charter (brief #11): name first, then a slot LIST ---- */
.gv-charter {
  padding: 22px 24px 20px;
}
/* the pin sits ON the sheet now, so the heading clears it */
.gv-head--pinned {
  padding-left: 22px;
}
.gv-namefield {
  display: flex;
  gap: 10px;
  align-items: baseline;
  flex-wrap: wrap;
  margin: 0 0 4px;
}
.gv-namefield label {
  font-family: var(--gv-sans);
  font-size: 11px;
  letter-spacing: 1.6px;
  color: var(--gv-ink-muted);
}
.gv-namefield .gv-input {
  flex: 1;
  min-width: 200px;
  font-size: 15px;
  padding: 8px 12px;
}
.gv-slotlist {
  list-style: none;
  margin: 14px 0 0;
  padding: 0;
}
.gv-slotrow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 116px;
  gap: 14px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid #b3a07555;
}
.gv-slotrow:first-child { border-top: none; }
.gv-slotwho { min-width: 0; }
/* names may ellipsize; numbers never do (brief #8) */
.gv-slotname {
  display: block;
  font-size: 15.5px;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gv-slotname em { color: var(--gv-ink-muted); }
.gv-slotsub {
  display: block;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.2px;
  color: var(--gv-ink-muted);
  margin-top: 1px;
}
.gv-slotact {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.gv-slotact > .gv-btn {
  width: 100%;
  text-align: center;
  padding: 6px 8px;
  font-size: 12.5px;
}
.gv-slotpair {
  display: flex;
  gap: 6px;
}
.gv-slotpair .gv-btn {
  flex: 1;
  padding: 5px 4px;
  font-size: 12px;
}
.gv-shop {
  max-width: 1140px;
  margin: 0 auto;
}
.gv-counters {
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.gv-counters .gv-sheet {
  flex: 1 1 480px;
  margin-bottom: 0;
}
.gv-counters .gv-sheet:nth-child(2n) { --gv-tilt: 0.3deg; }
.gv-counters .gv-sheet:nth-child(2n + 1) { --gv-tilt: -0.35deg; }

/* ============ brief #10: portrait surfaces + the founding muster ============
   Arrangement only — every grade lives in treatment.css. */

/* the name cell wherever a paste rides beside a name (roster, after-action) */
.gv-who {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gv-whosub {
  display: block;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.2px;
  color: var(--gv-ink-muted);
}

/* hero dossier: the photograph and the identity line share the head */
.gv-herohead {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 14px;
}
.gv-heroident { min-width: 0; }

/* the marshal's letter: correspondent's likeness beside their words */
.gv-letter {
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.gv-letter > span { min-width: 0; }

/* dispatch marching strip */
.gv-dteam {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 14px;
}
.gv-dmember {
  width: 58px;
  text-align: center;
}
.gv-dmember .gv-paste--chip { margin: 0 auto; }
.gv-dname,
.gv-dstat {
  display: block;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  margin-top: 3px;
}
/* names may ellipsize; the numbers beside them never do */
.gv-dname {
  color: var(--gv-ink-soft);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gv-dstat { color: var(--gv-ink-muted); }

/* ---- the founding muster ---- */
.gv-muster {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 0 22px;
  align-items: start;
  max-width: 1140px;
  margin: 0 auto;
}
.gv-muster-full { grid-column: 1 / -1; }
@media (max-width: 980px) {
  .gv-muster { grid-template-columns: 1fr; }
}
.gv-muster .gv-sheet { margin-bottom: 22px; }

.gv-roll {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gv-rollmember {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  text-align: left;
  font-family: var(--gv-serif);
  color: var(--gv-ink);
  background: #e2d4b244;
  border: 1px solid #a8905e88;
  border-radius: 2px;
  padding: 6px 8px;
  cursor: pointer;
}
.gv-rollmember[aria-pressed='true'] {
  border-color: var(--gv-wax);
  box-shadow: inset 0 0 0 2px #8c2f2880;
}
.gv-rollmember .gv-paste { grid-row: span 2; }
.gv-rollname {
  font-weight: 700;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gv-rollcls {
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.1px;
  color: var(--gv-ink-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.gv-mustergrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.gv-mtile {
  cursor: pointer;
  text-align: center;
  font-family: var(--gv-serif);
  color: var(--gv-ink);
  border: 1px solid #a8905e88;
  border-radius: 2px;
  padding: 9px 6px 7px;
  background: #e2d4b244;
}
.gv-mtile[aria-pressed='true'] {
  border-color: var(--gv-wax);
  box-shadow: inset 0 0 0 2px #8c2f2880;
}
.gv-mtile .gv-paste {
  width: 62px;
  margin: 0 auto;
  display: block;
  transform: none;
}
.gv-mname {
  display: block;
  font-family: var(--gv-sans);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.9px;
  margin-top: 6px;
}
.gv-mavail {
  display: block;
  font-size: 10.5px;
  color: var(--gv-ink-muted);
}

/* the component drawer's grade row (brief #10 — all grades, one subject) */
.gv-gradegrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: 16px;
  margin-bottom: 12px;
}
.gv-gradecell {
  margin: 0;
  text-align: center;
}
.gv-gradecell .gv-paste { width: 92px; }
.gv-gradecell figcaption {
  margin-top: 7px;
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.1px;
  color: var(--gv-ink-muted);
}
.gv-gradecell figcaption b {
  display: block;
  color: var(--gv-ink);
  font-size: 11.5px;
}

/* ============ rollout step 7: settings ============ */
.gv-settings {
  max-width: 860px;
  margin: 0 auto;
}
.gv-settings .gv-sheet {
  margin-bottom: 22px;
}

/* ============ brief #12: the field ============
   Geometry lives in CombatField.tsx; colour lives here, tokens only.
   SIDE IS CARRIED BY FORM (solid guild disc vs hollow enemy ring), never by
   colour — the frozen status set only ever tints an HP bar, and the bar is
   always paired with the number beside it. Nothing below is ambience, so flat
   mode has nothing here to strip. */
.gv-fieldwrap {
  position: relative;
}
.gv-field {
  display: block;
  width: 100%;
  height: auto;
  max-width: 700px;
  margin: 0 auto;
}
.gv-field text {
  font-family: var(--gv-sans);
}

.gv-field-ground { fill: #00000006; }
.gv-field-border { fill: none; stroke: var(--gv-ink); stroke-width: 1.4; }
.gv-field-rule { stroke: var(--gv-ink); stroke-width: 0.7; opacity: 0.24; }
.gv-field-rule--fine { stroke-width: 0.4; opacity: 0.14; }
.gv-field-tick { stroke: var(--gv-ink); stroke-width: 1; }
.gv-field-muster { stroke: var(--gv-ink-muted); stroke-width: 0.9; stroke-dasharray: 2 6; opacity: 0.65; }
.gv-field-scale { stroke: var(--gv-ink); stroke-width: 1.4; }

.gv-field-axis {
  font-size: 9px;
  letter-spacing: 1.1px;
  fill: var(--gv-ink-soft);
}
.gv-field-axis--faint { fill: var(--gv-ink-muted); }

/* unit glyphs — form, not colour */
.gv-field-hero { fill: var(--gv-ink); stroke: var(--gv-ink); stroke-width: 1.8; }
.gv-field-hero--down { fill: var(--gv-vellum); }
.gv-field-foe { fill: var(--gv-vellum); stroke: var(--gv-ink); stroke-width: 2.2; }
.gv-field-foe-pip { fill: var(--gv-ink); }
.gv-field-glyph-stroke { stroke: var(--gv-ink); stroke-width: 2.2; }
.gv-field-slain { opacity: 0.4; }
/* Selection is circled in PENCIL, not red: red ink is the world talking back
   and lives in the margin (brief #8). A thin ink ring is unused elsewhere on
   this sheet, so it carries one meaning and only one. */
.gv-field-selected { fill: none; stroke: var(--gv-ink); stroke-width: 1.2; opacity: 0.7; }
.gv-field-hit { fill: transparent; }
.gv-field-unit { cursor: pointer; }

.gv-field-name {
  font-size: 9.5px;
  letter-spacing: 1px;
  fill: var(--gv-ink);
  paint-order: stroke;
  stroke: var(--gv-vellum);
  stroke-width: 3px;
  stroke-linejoin: round;
}
.gv-field-name--gone { opacity: 0.45; }
/*
  Brief #20 §6 — the size WORD, the labelled twin of the glyph diameter.
  Flourish never replaces the number (brief #8), so size is stated in ink as
  well as drawn. Uses --gv-ink-soft, NOT a status colour: the frozen status set
  is label-paired to HP state and must not acquire a second meaning.
  ⚠ DATA, not ambience — flat mode keeps it (no rule strips this).
*/
.gv-field-size {
  font-size: 8px;
  letter-spacing: 0.5px;
  fill: var(--gv-ink-soft);
}
.gv-field-hp {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 9.5px;
  fill: var(--gv-ink-soft);
  paint-order: stroke;
  stroke: var(--gv-vellum);
  stroke-width: 3px;
  stroke-linejoin: round;
}
.gv-field-leader { fill: none; stroke: var(--gv-ink-muted); stroke-width: 0.7; opacity: 0.55; }

/* HP bar: frozen status set, NEVER the sole carrier — the number is always beside it */
.gv-field-bar { fill: #00000012; stroke: var(--gv-vellum-edge); stroke-width: 0.5; }
.gv-field-bar-fill--s0 { fill: var(--gv-s0); }
.gv-field-bar-fill--s1 { fill: var(--gv-s1); }
.gv-field-bar-fill--s2 { fill: var(--gv-s2); }
.gv-field-bar-fill--s3 { fill: var(--gv-s3); }

.gv-field-ring { fill: #3a2d1c08; stroke: var(--gv-ink); stroke-width: 0.9; stroke-dasharray: 3 3; opacity: 0.75; }
.gv-field-target { stroke: var(--gv-ink); stroke-width: 0.9; stroke-dasharray: 3 4; opacity: 0.28; fill: none; }

.gv-field-strike { stroke: var(--gv-ink); stroke-width: 1.5; opacity: 0.85; }
.gv-field-strike--crit { stroke-width: 2.6; }
.gv-field-strike--miss { opacity: 0.25; stroke-dasharray: 2 3; }
.gv-field-strike--reaction { stroke-width: 2.2; stroke-dasharray: 6 3; opacity: 0.9; }
.gv-field-critring { fill: none; stroke: var(--gv-ink); stroke-width: 1.4; }
.gv-field-damage {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  font-weight: 700;
  fill: var(--gv-ink);
}

/* held (skim): the field stops pretending and says so */
.gv-field-veil { fill: var(--gv-vellum); opacity: 0.55; }
.gv-field-heldlabel { font-size: 13px; letter-spacing: 3px; fill: var(--gv-ink-soft); }
.gv-field-heldnote {
  font-family: var(--gv-serif);
  font-style: italic;
  font-size: 12.5px;
  fill: var(--gv-ink-muted);
}

/* the roster rail beside the field */
.gv-fieldgrid {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) {
  .gv-fieldgrid { grid-template-columns: 1fr; }
}
.gv-roster { list-style: none; margin: 0; padding: 0; }
.gv-roster li {
  display: grid;
  grid-template-columns: 14px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px dotted var(--gv-vellum-edge);
  cursor: pointer;
}
.gv-roster li:last-child { border-bottom: 0; }
.gv-roster li[aria-selected='true'] { background: #0000000d; }
.gv-roster li.gv-roster--gone { opacity: 0.45; }
.gv-roster-name { font-size: 13.5px; line-height: 1.15; }
.gv-roster-name small {
  display: block;
  font-family: var(--gv-sans);
  font-size: 9.5px;
  letter-spacing: 0.9px;
  color: var(--gv-ink-muted);
}
.gv-roster-hp { text-align: right; min-width: 74px; }
.gv-roster-hp b {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11.5px;
  font-weight: 400;
}

/* the two gauges: silence against the stalemate window, and target churn */
.gv-gauge { margin-top: 10px; }
.gv-gauge-label {
  font-family: var(--gv-sans);
  font-size: 10.5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--gv-ink-muted);
  display: block;
  margin-bottom: 3px;
}
.gv-gauge-label em {
  text-transform: none;
  letter-spacing: 0;
  font-family: var(--gv-serif);
}
.gv-gauge-bar {
  display: block;
  position: relative;
  height: 8px;
  background: #00000012;
  border: 1px solid var(--gv-vellum-edge);
}
.gv-gauge-bar i { display: block; height: 100%; background: var(--gv-ink-soft); }
.gv-gauge-bar i.gv-gauge--warn { background: var(--gv-s1); }
.gv-gauge-bar i.gv-gauge--hot { background: var(--gv-s3); }

/* roster glyph + compact HP bar: the number leads, the frozen set seconds it */
.gv-roster-glyph { display: block; }
.gv-roster-bar {
  display: block;
  height: 5px;
  margin-top: 2px;
  background: #00000018;
  border: 1px solid var(--gv-vellum-edge);
}
.gv-roster-bar i { display: block; height: 100%; }
.gv-roster-bar i.gv-roster-bar--s0 { background: var(--gv-s0); }
.gv-roster-bar i.gv-roster-bar--s1 { background: var(--gv-s1); }
.gv-roster-bar i.gv-roster-bar--s2 { background: var(--gv-s2); }
.gv-roster-bar i.gv-roster-bar--s3 { background: var(--gv-s3); }

/* the fight scrubber */
.gv-scrub {
  display: block;
  width: 100%;
  margin-top: 8px;
  accent-color: var(--gv-ink-soft);
}

/* the day's record: where the fights sit along the run */
.gv-strip {
  position: relative;
  height: 30px;
  background: #00000010;
  border: 1px solid var(--gv-vellum-edge);
  margin: 4px 0 2px;
}
.gv-strip-seg {
  position: absolute;
  top: 0;
  bottom: 0;
  padding: 0;
  background: #3a2d1c22;
  border: 0;
  border-left: 1px solid var(--gv-ink-soft);
  border-right: 1px solid var(--gv-ink-soft);
  cursor: pointer;
}
.gv-strip-seg--open { background: #3a2d1c44; }
.gv-strip-seg b {
  position: absolute;
  top: 3px;
  left: 4px;
  font-family: var(--gv-sans);
  font-size: 9px;
  letter-spacing: 0.6px;
  color: var(--gv-ink-soft);
  white-space: nowrap;
}
.gv-strip-play {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: var(--gv-red-ink);
}


/* ============ M3 track T: Town & Upgrades (mockup variant B, "Do This Next") ============
   Additive only. Everything is prefixed gv-tn- and reuses the existing tokens;
   status colours go through var(--gv-s*) and are always paired with a word. */
.gv-tn { max-width: 1140px; font-variant-numeric: lining-nums; } /* old-style 0 reads as a letter o */
.gv-tn .gv-head { font-size: 19px; }
.gv-tn .gv-head .gv-sub { font-size: 12.5px; }
.gv-tn-side .gv-sheet { margin-bottom: 22px; }
.gv-tn-pickshead { margin: 0 0 14px; color: #e6cf98; font-size: 17px; }
.gv-tn-pickshead b { color: #fff3cf; }
.gv-tn-pick { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 16px; }
.gv-tn-rank { width: 46px; height: 46px; font-size: 24px; font-weight: 700; color: #f4ecd8; }
.gv-tn-pick .gv-head { margin-bottom: 6px; }
.gv-tn-gain { font-size: 21px; font-weight: 700; margin: 0 0 4px; line-height: 1.25; }
.gv-tn-pickgrid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-top: 8px; }
table.gv-tn-need { border-collapse: collapse; font-size: 14.5px; min-width: 330px; }
table.gv-tn-need th { font-family: var(--gv-sans); font-size: 11.5px; letter-spacing: 1.4px; color: var(--gv-ink-muted); text-align: left; padding: 0 14px 3px 0; border-bottom: 1px solid #8c6a3a55; }
table.gv-tn-need th.n, table.gv-tn-need td.n { text-align: right; }
table.gv-tn-need td { padding: 3px 14px 3px 0; border-bottom: 1px solid #8c6a3a22; font-variant-numeric: tabular-nums lining-nums; }
table.gv-tn-need td.it { font-weight: 700; text-transform: capitalize; white-space: nowrap; }
table.gv-tn-need td.left b { color: var(--gv-ch-resource); }
.gv-tn-act { text-align: right; }
.gv-tn-act .gv-btn { display: block; margin-left: auto; }
.gv-tn-act small { display: block; margin-top: 5px; color: var(--gv-ink-muted); font-size: 12.5px; }
.gv-tn-bigbtn { font-size: 16px; padding: 8px 18px; }
.gv-tn .gv-btn { white-space: nowrap; }
.gv-tn .gv-btn--tiny { font-size: 12.5px; padding: 1px 8px; }
.gv-tn .gv-btn[aria-pressed="true"] { background: #cbb98d; box-shadow: inset 0 1px 3px #00000040; font-weight: 700; }
.gv-tn-gap { font-size: 16px; }

/* the "not working yet" guard: greyed, struck-dashed, and always worded */
.gv-tn-unwired { color: var(--gv-ink-faint); }
.gv-tn-tag { display: inline-block; font-family: var(--gv-sans); font-size: 11.5px; letter-spacing: 1px; font-style: normal; font-weight: 700; color: var(--gv-ink-soft); border: 1px dashed var(--gv-ink-muted); border-radius: 3px; padding: 0 6px; line-height: 18px; white-space: nowrap; background: #ffffff30; }
.gv-tn-none { color: var(--gv-ink-muted); font-size: 13px; }

/* costs */
.gv-tn-cost { display: flex; flex-wrap: wrap; }
.gv-tn-gold, .gv-tn-res { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; border-radius: 3px; padding: 0 6px; line-height: 22px; white-space: nowrap; margin: 0 4px 3px 0; }
.gv-tn-gold { border: 1px solid var(--gv-brass-deep); background: #c9a86a30; }
.gv-tn-res { border: 1px solid #8c6a3a66; background: #ffffff40; }
.gv-tn-res b, .gv-tn-gold b { font-variant-numeric: tabular-nums lining-nums; }
.gv-tn-res.short, .gv-tn-gold.short { border-style: dashed; border-color: var(--gv-red-ink); color: var(--gv-red-ink); background: #9c342812; }
.gv-tn-res small, .gv-tn-gold small { color: var(--gv-red-ink); font-size: 12px; }

/* chips beyond the frozen four: neutral, still label-paired */
.gv-tn .gv-chip { font-size: 13.5px; font-weight: 700; }
.gv-tn-chip-done i { background: var(--gv-brass-mid); }
.gv-tn-chip-later i { background: transparent; border: 1.5px dashed var(--gv-ink-muted); }

/* the fold + ledger */
details.gv-tn-fold > summary { cursor: pointer; font-size: 18px; font-weight: 700; display: flex; gap: 12px; align-items: baseline; list-style: none; flex-wrap: wrap; }
details.gv-tn-fold > summary::-webkit-details-marker { display: none; }
details.gv-tn-fold > summary::before { content: "\25B8"; color: var(--gv-brass-deep); width: 14px; }
details.gv-tn-fold[open] > summary::before { content: "\25BE"; }
details.gv-tn-fold > summary small { font-weight: 400; font-size: 13.5px; color: var(--gv-ink-muted); }
.gv-tn-filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
table.gv-tn-ledger { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14.5px; line-height: 1.35; }
table.gv-tn-ledger th { font-family: var(--gv-sans); font-size: 11.5px; letter-spacing: 1.4px; color: var(--gv-ink-muted); text-align: left; padding: 0 10px 4px 0; border-bottom: 1px solid #8c6a3a55; }
table.gv-tn-ledger td { padding: 8px 10px 8px 0; vertical-align: top; border-bottom: 1px solid #8c6a3a26; overflow-wrap: anywhere; }
table.gv-tn-ledger td.nm b { font-size: 16px; display: block; }
table.gv-tn-ledger td.nm > span { display: block; color: var(--gv-ink-muted); font-size: 13px; }
table.gv-tn-ledger td.nm > span.gv-tn-pickmark { color: var(--gv-wax); font-weight: 700; }
table.gv-tn-ledger td.go { text-align: right; padding-right: 0; }
.gv-tn-why { margin: 3px 0 0; padding: 0; list-style: none; font-size: 13.5px; line-height: 1.4; }
.gv-tn-why li { padding-left: 14px; position: relative; color: var(--gv-red-ink); margin-bottom: 2px; }
.gv-tn-why li::before { content: "\2715"; position: absolute; left: 0; font-size: 11px; top: 1px; }

/* side column */
table.gv-tn-mini { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.35; }
table.gv-tn-mini th { text-align: left; font-family: var(--gv-sans); font-size: 11.5px; letter-spacing: 1.4px; color: var(--gv-ink-muted); font-weight: 700; padding: 0 8px 4px 0; border-bottom: 1px solid #8c6a3a55; }
table.gv-tn-mini td { padding: 5px 8px 5px 0; border-bottom: 1px solid #8c6a3a22; vertical-align: middle; }
table.gv-tn-mini .n, table.gv-tn-mini th.n { text-align: right; font-variant-numeric: tabular-nums lining-nums; }
table.gv-tn-mini .rn { font-weight: 700; text-transform: capitalize; white-space: nowrap; }
table.gv-tn-mini .w { color: var(--gv-ink-muted); font-size: 13px; }
.gv-tn-heroes { display: inline-flex; gap: 2px; vertical-align: middle; margin-right: 8px; }
.gv-tn-heroes i { display: block; width: 9px; height: 15px; border-radius: 4px 4px 2px 2px; background: var(--gv-ink-faint); }
.gv-tn-heroes i.new { background: var(--gv-brass-deep); }
.gv-tn-pt { font-weight: 700; white-space: nowrap; }
.gv-tn-roster { margin: 0 0 8px; font-size: 14.5px; }
.gv-tn-name { display: block; margin: 0 0 8px; font-size: 13.5px; color: var(--gv-ink-soft); }
.gv-tn-name input { width: 100%; box-sizing: border-box; margin-top: 3px; }

/* ============ M4: fog of war on the chart ============
   Unsurveyed land is an opaque dark cover with a faint hatch — clearly "not
   information", never just a dimmer map. */
.gv-chart-fog {
  fill: #2c2417;
}
.gv-chart-fog-line {
  stroke: #54462d;
}
.gv-chart-rumour-ring {
  fill: #2c2417;
  stroke: var(--gv-vellum);
}
.gv-chart-rumour {
  fill: var(--gv-vellum);
  font-style: italic;
  paint-order: stroke;
  stroke: #2c2417;
  stroke-width: 2.5px;
}

/* ===== MOCKUP-ONLY additions (prefix mk-). Everything above is the real stylesheet, verbatim. ===== */
body { margin: 0; font-size: 15px; }
.mk-wrap { max-width: 1180px; margin: 0 auto; position: relative; }
.mk-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.mk-tag { font-family: var(--gv-sans); font-size: 12px; letter-spacing: 2px; color: #2a1f0e; background: linear-gradient(160deg, var(--gv-brass-hi), var(--gv-brass-mid)); border: 1px solid var(--gv-brass-edge); padding: 3px 12px; border-radius: 2px; }
.mk-tag.alt { background: transparent; color: #d8bd85; border-color: #d8bd8566; }
.mk-note { color: #c9b98f; font-size: 13px; }
.mk-note a { color: #e6cf98; }
.mk-lead { margin: 0 0 12px; color: #e6cf98; font-size: 16.5px; max-width: 880px; line-height: 1.4; }
.mk-lead b { color: #fff3cf; }
.gv-sheet .gv-head { font-size: 19px; }
.gv-sheet .gv-head .gv-sub { font-size: 12.5px; }
.gv-btn { white-space: nowrap; font-size: 14.5px; }
.gv-btn[aria-pressed="true"] { background: #cbb98d; box-shadow: inset 0 1px 3px #00000040; font-weight: 700; }
.mk-tiny { font-size: 12.5px; padding: 2px 9px; }
.mk-big { font-size: 16.5px; padding: 9px 20px; }
.mk-bad { color: var(--gv-red-ink); font-weight: 700; }
.mk-dim { color: var(--gv-ink-muted); }

/* mockup controls strip (leather side, so light text) */
.mk-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 18px; padding: 8px 12px; border: 1px dashed #d8bd8566; border-radius: 4px; color: #c9b98f; font-size: 13.5px; }
.mk-ctl b { color: #e6cf98; }
.mk-ctl .gv-btn { font-size: 13px; padding: 3px 10px; }
.mk-clicks { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; }
.mk-clicks .gv-plate b { font-size: 16px; }
.mk-done { color: #9fe39f; font-weight: 700; }

/* hero face (zero image assets: inline SVG silhouette on the slate plate) */
.mk-face { width: 34px; height: 42px; display: grid; place-items: center; flex: none; box-sizing: border-box; }
.mk-face svg { width: 18px; height: 27px; fill: #5d6471; display: block; }
.mk-ico { vertical-align: -3px; flex: none; color: var(--gv-ink-muted); }
.mk-word { margin: 0; font-size: 14px; }
.mk-word span { font-size: 13px; }
.mk-b3 { border: 2px dashed #d8bd8566; border-radius: 4px; padding: 10px 14px; color: #c9b98f; font-size: 14.5px; margin-top: 4px; }
.mk-b3 b { color: #e6cf98; }
.mk-b3 .mk-ico { color: #d8bd85; }
.mk-lockline { display: flex; align-items: center; gap: 8px; color: var(--gv-red-ink); font-weight: 700; font-size: 14px; }
.mk-stamp { position: static; display: inline-block; transform: rotate(-2deg); font-size: 12.5px; padding: 2px 9px; }
.mk-hurt { display: inline-block; font-size: 12px; font-weight: 700; color: #7a3a14; border: 1px solid var(--gv-s2); background: #ec835a30; border-radius: 3px; padding: 0 5px; margin-left: 6px; line-height: 17px; }
.mk-foot { color: #c9b98f; font-size: 13px; margin: 14px 0 0; line-height: 1.5; }
.mk-foot b { color: #e6cf98; }
.mk-sheetgap > .gv-sheet { margin-bottom: 22px; }
.gv-sheet .gv-notice-stats { margin-top: 10px; }
.gv-sheet .gv-nstat > span { font-size: 15px; }

/* Variant C — The Week Plan */
.c-plan { padding: 20px 22px 18px; margin-bottom: 24px; }
.c-row { display: grid; grid-template-columns: 210px minmax(0, 1fr) 190px; gap: 22px; padding: 16px 0 18px; border-bottom: 1px solid #8c6a3a44; align-items: start; }
.c-row.is-out { background: #9c342810; margin: 0 -10px; padding-left: 10px; padding-right: 10px; }
.c-who { min-width: 0; }
.c-bn { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.c-bn > b { font-size: 21px; }
.c-lv { font-size: 11px; padding: 2px 8px; }
.c-lv b { font-size: 17px; }
.c-faces { display: flex; gap: 3px; margin: 9px 0 5px; flex-wrap: wrap; }
.c-faces .mk-face { width: 26px; height: 32px; }
.c-faces .mk-face svg { width: 13px; height: 20px; }
.b-emptyface { border: 1.5px dashed #8c6a3a77; border-radius: 2px; }
.c-names { margin: 0; font-size: 12.5px; color: var(--gv-ink-soft); line-height: 1.45; }
.c-job { min-width: 0; }
.c-ctl { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.c-cyc { margin: 0; font-size: 13.5px; font-weight: 700; }
.c-cycb { display: flex; gap: 6px; flex-wrap: wrap; }
.c-warn { margin: 7px 0 0; font-size: 13.5px; line-height: 1.35; }
.c-foot { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; padding-top: 16px; }
.c-what p { margin: 0 0 3px; font-size: 14px; line-height: 1.4; }
.a-oh { margin: 0 0 3px; font-family: var(--gv-sans); font-size: 11.5px; letter-spacing: 1.6px; color: var(--gv-ink-muted); font-weight: 700; }
.a-jn { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.16; overflow-wrap: anywhere; }
.a-meta { margin: 2px 0 6px; font-size: 13px; color: var(--gv-ink-muted); line-height: 1.35; }
.a-wipe { margin: 6px 0 0; font-size: 13.5px; }
.a-other { margin: 8px 0 0; font-size: 13.5px; color: var(--gv-ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.a-other .gv-difficulty { font-size: 12.5px; }
.a-lockmsg { margin: 8px 0 0; font-size: 13.5px; color: var(--gv-red-ink); }
.a-lock { color: var(--gv-red-ink); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.a-hn { display: block; min-width: 0; line-height: 1.25; }
